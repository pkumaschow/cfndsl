stages:
  - build
  - scan

variables:
  REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE"

build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - >
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}"
      > /kaniko/.docker/config.json
  script:
    - export CFNDSL_VERSION=$(grep -oE 'CFNDSL_VERSION="[0-9.]+"' "${CI_PROJECT_DIR}/Dockerfile" | head -1 | cut -d'"' -f2)
    - echo "Building cfndsl image at version ${CFNDSL_VERSION}"
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${REGISTRY_IMAGE}:${CFNDSL_VERSION}"
      --destination "${REGISTRY_IMAGE}:latest"
      --build-arg "CFNDSL_VERSION=${CFNDSL_VERSION}"
      --build-arg "APK_REFRESH=${CI_PIPELINE_ID}"
      --tar-path "${CI_PROJECT_DIR}/image.tar"
      --insecure
      --skip-tls-verify
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

scout-cves:
  stage: scan
  image: alpine:3.20
  needs:
    - job: build-image
      artifacts: true
  variables:
    GIT_STRATEGY: none
    DOCKER_SCOUT_HUB_USER: "$DOCKERHUB_USER"
    DOCKER_SCOUT_HUB_PASSWORD: "$DOCKERHUB_PAT"
  before_script:
    # Install a PINNED docker-scout. The previous version queried GitHub's API unauthenticated to
    # discover "latest" — that is rate-limited (60/hr/IP), and on throttle it returned an empty
    # version, downloaded an error page, and left a broken /usr/local/bin/docker-scout that failed
    # with "syntax error: unexpected (". Pinning removes the API call; download to a file + set -e
    # so a failed download aborts the job instead of producing a corrupt binary.
    - apk add --no-cache curl ca-certificates tar
    - |
      set -eu
      SCOUT_VERSION=1.21.0
      curl -fsSL "https://github.com/docker/scout-cli/releases/download/v${SCOUT_VERSION}/docker-scout_${SCOUT_VERSION}_linux_amd64.tar.gz" -o /tmp/docker-scout.tgz
      tar xzf /tmp/docker-scout.tgz -C /usr/local/bin docker-scout
      chmod +x /usr/local/bin/docker-scout
    - docker-scout version
  script:
    - docker-scout cves "archive://${CI_PROJECT_DIR}/image.tar" --only-severity critical,high --only-fixed --exit-code
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
